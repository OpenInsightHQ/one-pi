name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/one-pi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # main 分支推送 -> one-pi:latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # v2.0.3 格式标签 -> one-pi:v2.0.3 (与 git tag 同名)
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-source:
    # v3.0.2 格式标签 -> 源码包 pi-3.0.2.tar.gz 发布到 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          git archive --format=tar.gz --prefix="pi-${VERSION}/" -o "pi-${VERSION}.tar.gz" "${GITHUB_SHA}"
          sha256sum "pi-${VERSION}.tar.gz" > "pi-${VERSION}.tar.gz.sha256"
          ls -lh pi-*

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "pi-${VERSION}.tar.gz" "pi-${VERSION}.tar.gz.sha256" --clobber
          else
            gh release create "$TAG" "pi-${VERSION}.tar.gz" "pi-${VERSION}.tar.gz.sha256" --title "$TAG" --generate-notes
          fi
